info:
  name: Pegar Proximo Diagnostico
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/execucao/fila/DIAGNOSTICO/proxima"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.data) {
          bru.setEnvVar("ordemExecucaoId", res.body.data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
