info:
  name: Registrar Diagnostico
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/execucao/ordens/{{ordemExecucaoId}}/diagnostico"
  body:
    type: json
    data: |-
      {
        "diagnostico": "Vazamento na junta do cárter; trocar óleo e filtro.",
        "itens": [
          { "tipo": "SERVICO", "referenciaId": "{{servicoId}}", "quantidade": 1 },
          { "tipo": "INSUMO", "referenciaId": "{{insumoId}}", "quantidade": 4 }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
