apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homolog
resources:
  - ../../base
# O CD troca os placeholders pelo repositório do ECR e pela tag <env>-<sha>.
images:
  - name: execution-service
    newName: ci-placeholder-image
    newTag: ci-placeholder-tag
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: NEW_RELIC_APP_NAME, value: oficina-execution-service-homolog }
    target: { kind: Deployment, name: execution-service }
  - patch: |-
      - op: add
        path: /data/OS_SERVICE_URL
        value: http://os-service.homolog.svc.cluster.local
    target: { kind: ConfigMap, name: execution-service-config }
